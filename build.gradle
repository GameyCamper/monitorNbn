import java.text.SimpleDateFormat

plugins {
	id "org.sonarqube" version "7.3.1.8318"
}
  
sonar {
	properties {
		property "sonar.projectKey", "monitorNbn"
	    property "sonar.projectName", "monitorNbn"
		property "sonar.host.url", "http://sonarqube-sonarqube.devops-tools.svc.cluster.local:9000/sonarQube"
//	    property "sonar.host.url", "http://devci.ineson.home/sonarQube"
	}
}
  
allprojects {
    apply plugin: 'java'

    group = 'me.ineson.monitorNbn'
    version = '1.1'

    repositories {
        mavenCentral()
        mavenLocal()
        maven { url = 'https://repo.springsource.org/release' }
    }


    ext  {
        junitVersion = '6.1.2'
        mongodbVersion = '4.6.1'
        springBootVersion = '2.7.18'
        startTime = new java.text.SimpleDateFormat("dd-MMM-yyyy hh:mm:ss").format(new Date())
		
    }

}


subprojects {

	apply plugin: 'groovy'
	apply plugin: 'checkstyle'
	apply plugin: 'codenarc'
	apply plugin: 'jacoco'

	tasks.withType(JavaCompile) {
	    options.release = 8
	}
    plugins.withId('groovy') {
	    tasks.named("compileTestGroovy") {
			targetCompatibility = JavaVersion.VERSION_21
	    }
    }
    plugins.withId('groovy') {
	    tasks.named("compileGroovy") {
			targetCompatibility = JavaVersion.VERSION_21
        }
    }

	checkstyle {
		toolVersion = '14.1.0'
		ignoreFailures = true
	}

	codenarc {
		ignoreFailures = true
	}
 
	dependencies {
        implementation 'org.apache.commons:commons-lang3:3.20.0'
        implementation 'org.slf4j:slf4j-api:1.7.32'
        implementation 'ch.qos.logback:logback-classic:1.2.13'

        implementation platform('org.apache.groovy:groovy-bom:5.1.0')
        //implementation 'org.apache.groovy:groovy'
        testImplementation platform("org.spockframework:spock-bom:2.4-groovy-5.0")
        testImplementation "org.spockframework:spock-core"
        
        testImplementation(platform("org.junit:junit-bom:6.1.2"))
	    testImplementation("org.junit.jupiter:junit-jupiter")
	    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
		testImplementation 'org.junit.platform:junit-platform-engine:1.10.3'
	}
	
    test {
        useJUnitPlatform()
        finalizedBy jacocoTestReport
    }
	jacocoTestReport {
		reports {
			xml.required = true
			csv.required = false
			html.outputLocation = file("${buildDir}/jacocoHtml")
		}
	}
}


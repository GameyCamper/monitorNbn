import java.text.SimpleDateFormat

allprojects {
    apply plugin: 'java'

    group = 'me.ineson.monitorNbn'
    version = '1.1'

    repositories {
        mavenCentral()
        mavenLocal()
        maven { url = 'https://repo.springsource.org/release' }
    }

    tasks.withType(JavaCompile) {
        options.release = 8
    }    

    ext  {
        junitVersion = '6.1.2'
        mongodbVersion = '4.6.1'
        springBootVersion = '2.7.18'
        startTime = new java.text.SimpleDateFormat("dd-MMM-yyyy hh:mm:ss").format(new Date())
		
    }

}


subprojects {

	apply plugin: 'groovy'
	apply plugin: 'jacoco'
	
	dependencies {
        implementation 'org.apache.commons:commons-lang3:3.20.0'
        implementation 'org.slf4j:slf4j-api:1.7.32'
        implementation 'ch.qos.logback:logback-classic:1.2.13'

        implementation platform('org.apache.groovy:groovy-bom:5.1.0')
        //implementation 'org.apache.groovy:groovy'
        testImplementation platform("org.spockframework:spock-bom:2.4-groovy-5.0")
        testImplementation "org.spockframework:spock-core"
        
        testImplementation(platform("org.junit:junit-bom:6.1.2"))
	    testImplementation("org.junit.jupiter:junit-jupiter")
	    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
		testImplementation 'org.junit.platform:junit-platform-engine:1.10.3'
	}
	
    test {
        useJUnitPlatform()
        finalizedBy jacocoTestReport
    }
	jacocoTestReport {
		reports {
			xml.required = false
			csv.required = false
			html.outputLocation = file("${buildDir}/jacocoHtml")
		}
	}
}

